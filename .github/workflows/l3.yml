name: L3

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      l3: ${{ steps.select.outputs.l3 }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          SELECT_LAYERS_MESSAGE: ${{ github.event.head_commit.message }} ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: bash tests/common/ci/select_layers.sh >> "$GITHUB_OUTPUT"

  l3-linux:
    needs: select
    if: needs.select.outputs.l3 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: L3 Linux Docker real setup
        run: bazel test --config=l3 --test_tag_filters=l3,-requires-macos //...

  l3-macos:
    needs: select
    if: needs.select.outputs.l3 == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: L3 macOS host real setup
        run: bazel test --config=l3 --test_tag_filters=l3,requires-macos //...
