name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.select.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          SELECT_LAYERS_MESSAGE: ${{ github.event.head_commit.message }} ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: bash tests/common/ci/select_layers.sh >> "$GITHUB_OUTPUT"

  e2e-linux:
    needs: select
    if: needs.select.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: Restore E2E image cache
        uses: actions/cache@v4
        with:
          path: /tmp/devtools-e2e-images
          key: e2e-images-${{ hashFiles('tests/common/docker/Dockerfile.e2e.ubuntu', 'tests/common/docker/Dockerfile.e2e.alinux3', 'tests/common/docker/Dockerfile.e2e.alinux4', 'cache/binaries/kernel-headers-5.10.134-20.2.al8.x86_64.rpm') }}
      - name: Pre-build E2E images (outside test timeout budgets)
        # A cache hit loads the three images and does not contact the Aliyun
        # mirror. A miss builds them here, outside bazel test timeouts, and
        # the cache action stores the tarballs for the next job.
        run: bash tests/common/ci/prebuild_e2e_images.sh
      - name: E2E Linux Docker real setup
        # Comma-separated positive tags are OR. Use -requires-macos so Linux
        # Docker E2E does not pick up Darwin host tests. GitHub ubuntu-latest
        # has 4 vCPUs; --jobs=2 leaves headroom for nested Docker. Raise the
        # UI log cap so a noisy nvim setup cannot hide the real Exit 1.
        run: bazel test --config=l3 --test_tag_filters=l3,-requires-macos --jobs=2 --experimental_ui_max_stdouterr_bytes=10485760 //...

  e2e-macos:
    needs: select
    if: needs.select.outputs.e2e == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: E2E macOS host real setup
        # requires-macos only (not l3,requires-macos). Bazel ORs positive tags,
        # so including l3 would also run Linux Docker E2E on Darwin.
        # macos-26 is 3–4 cores; --jobs=2. Homebrew is serialized via a lock
        # in run_e2e_test.sh so parallel brew installs cannot lock Cellar.
        run: bazel test --config=l3 --test_tag_filters=requires-macos --jobs=2 --experimental_ui_max_stdouterr_bytes=10485760 //...
