name: IT

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      it: ${{ steps.select.outputs.it }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          SELECT_LAYERS_MESSAGE: ${{ github.event.head_commit.message }} ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}
        run: bash tests/common/ci/select_layers.sh >> "$GITHUB_OUTPUT"

  it:
    needs: select
    if: needs.select.outputs.it == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: bazelbuild/setup-bazelisk@v3
      - name: IT Docker fake tests
        run: bazel test --config=l2 //...
