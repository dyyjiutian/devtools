# ────────────────────────────────────────────
# 基础设置
# ────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"   # 真彩色
set -g history-limit 50000
set -g buffer-limit 20
set -sg escape-time 0          # 消除 Vim ESC 延迟（关键！）
set -g display-time 1500
set -g remain-on-exit off
set -g repeat-time 300
setw -g allow-rename off       # 防止程序自动改 window 名

# ────────────────────────────────────────────
# 前缀键：改为 Ctrl-Space
# ────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix        # 双击 C-Space 发送到终端

# ────────────────────────────────────────────
# 索引从 1 开始（键盘顺序更自然）
# ────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on     # 关闭 window 后自动重排编号

# ────────────────────────────────────────────
# 鼠标支持
# ────────────────────────────────────────────
# set -g mouse on

# ────────────────────────────────────────────
# 键盘模式：Vi
# ────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi y   send -X copy-pipe-and-cancel "pbcopy"   # macOS
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# ────────────────────────────────────────────
# 窗口 / Pane 操作
# ────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# 新建 window/pane 保持当前路径
bind c new-window      -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane 大小调整（可连按）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# 快速切换 window
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window            # 在最近两个 window 间跳转

# ────────────────────────────────────────────
# vim-tmux-navigator 集成（需装插件）
# ────────────────────────────────────────────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

    bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
    bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
    bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
    bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

    bind -T copy-mode-vi C-h select-pane -L
    bind -T copy-mode-vi C-j select-pane -D
    bind -T copy-mode-vi C-k select-pane -U
    bind -T copy-mode-vi C-l select-pane -R

# ────────────────────────────────────────────
# 状态栏
# ────────────────────────────────────────────
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

# 颜色方案（适配深色终端）
set -g status-style                "bg=#1e1e2e,fg=#cdd6f4"
set -g window-status-style         "bg=#1e1e2e,fg=#6c7086"
set -g window-status-current-style "bg=#313244,fg=#89b4fa,bold"
set -g pane-border-style           "fg=#313244"
set -g pane-active-border-style    "fg=#89b4fa"
set -g message-style               "bg=#313244,fg=#f9e2af"

set -g status-left  "#[fg=#89b4fa,bold] #S #[fg=#6c7086]│ "
set -g status-left-length 30
set -g status-right "#[fg=#6c7086]#{?client_prefix,#[fg=#f38ba8]PREFIX ,}#[fg=#a6e3a1]%H:%M #[fg=#6c7086]│ #[fg=#cdd6f4]%m/%d"
set -g status-right-length 50

set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "

# ────────────────────────────────────────────
# TPM 插件管理
# ────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # 持久化 session
set -g @plugin 'tmux-plugins/tmux-continuum'    # 自动保存

# resurrect：同时恢复 vim session（需 vim-obsession）
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents 'on'

# continuum：每 15 分钟自动保存，启动时自动恢复
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
