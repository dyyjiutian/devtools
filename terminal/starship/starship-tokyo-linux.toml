"$schema" = 'https://starship.rs/config-schema.json'

format = """
[  ](bg:#a3aed2 fg:#090c0c)\
$username\
[@](bg:#a3aed2 fg:#090c0c)\
$hostname\
[](bg:#5f8f87 fg:#a3aed2)\
$directory\
[](fg:#5f8f87 bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
[](fg:#212736)\
\n$character"""

right_format = """$cmd_duration"""

[username]
show_always = true
style_user = "fg:#090c0c bg:#a3aed2"
style_root = "fg:#090c0c bg:#a3aed2"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "fg:#090c0c bg:#a3aed2"
format = '[$hostname]($style)'

[directory]
style = "fg:#e3e5e5 bg:#5f8f87"
format = "[ $path ]($style)"
truncation_length = 0
truncate_to_repo = false
truncation_symbol = "…/"
repo_root_format = "[ $before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path ]($style)"
before_repo_root_style = "fg:#e3e5e5 bg:#5f8f87"
repo_root_style = "fg:#ffdd77 bg:#5f8f87"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↑${ahead_count}↓${behind_count}"
modified = "*${count}"

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[cmd_duration]
min_time = 500
format = '[$duration](yellow) '
show_milliseconds = false
disabled = false

[time]
disabled = true
time_format = "%H:%M:%S"
style = "bold white"
format = '[$time]($style) '
