# Nginx Stream SNI Proxy Configuration
# 基于 SNI 透明转发 HTTPS 流量，无需 SSL 证书
# Place this file at: /etc/nginx/stream.d/sni_proxy.conf

stream {
    log_format sni_proxy '$remote_addr [$time_local] '
                         '$protocol $status $bytes_sent $bytes_received '
                         '$session_time -> $upstream_addr '
                         'sni=[$ssl_preread_server_name]';

    access_log /var/log/nginx/sni_proxy.log sni_proxy;

    # DNS 解析器（使用公共 DNS，确保能解析到海外地址）
    resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s ipv6=off;
    resolver_timeout 10s;

    # 根据 SNI 匹配目标域名
    map $ssl_preread_server_name $proxy_target {
        # === GitHub 生态 ===
        ~^(.+\.)?github\.com$               $ssl_preread_server_name:443;
        ~^(.+\.)?githubusercontent\.com$     $ssl_preread_server_name:443;
        ~^(.+\.)?githubassets\.com$          $ssl_preread_server_name:443;
        ~^(.+\.)?githubstatus\.com$          $ssl_preread_server_name:443;
        ~^(.+\.)?ghcr\.io$                  $ssl_preread_server_name:443;

        # === Docker Hub ===
        ~^(.+\.)?docker\.io$                $ssl_preread_server_name:443;
        ~^(.+\.)?docker\.com$               $ssl_preread_server_name:443;

        # === Google Container Registry / k8s ===
        ~^(.+\.)?gcr\.io$                   $ssl_preread_server_name:443;
        ~^(.+\.)?k8s\.gcr\.io$              $ssl_preread_server_name:443;
        ~^(.+\.)?registry\.k8s\.io$         $ssl_preread_server_name:443;
        ~^(.+\.)?quay\.io$                  $ssl_preread_server_name:443;

        # === npm ===
        ~^(.+\.)?npmjs\.com$                $ssl_preread_server_name:443;
        ~^(.+\.)?npmjs\.org$                $ssl_preread_server_name:443;

        # === Python PyPI ===
        ~^(.+\.)?pypi\.org$                 $ssl_preread_server_name:443;
        ~^(.+\.)?pythonhosted\.org$         $ssl_preread_server_name:443;

        # === Go modules ===
        ~^(.+\.)?golang\.org$               $ssl_preread_server_name:443;
        ~^(.+\.)?go\.dev$                   $ssl_preread_server_name:443;
        ~^(.+\.)?gopkg\.in$                 $ssl_preread_server_name:443;

        # === Helm ===
        ~^(.+\.)?helm\.sh$                  $ssl_preread_server_name:443;
        ~^(.+\.)?artifacthub\.io$           $ssl_preread_server_name:443;

        # === Rust crates ===
        ~^(.+\.)?crates\.io$                $ssl_preread_server_name:443;
        ~^(.+\.)?static\.crates\.io$        $ssl_preread_server_name:443;

        # 未匹配的域名不转发（安全起见，避免成为开放代理）
        default                              "";
    }

    server {
        listen 0.0.0.0:443;
        ssl_preread on;

        # proxy_pass 为空时 nginx 会直接关闭连接
        proxy_pass $proxy_target;

        proxy_connect_timeout 30s;
        proxy_timeout 600s;
        proxy_buffer_size 32k;

        # TCP keepalive
        proxy_socket_keepalive on;
    }
}
