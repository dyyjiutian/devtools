# Clash Meta (mihomo) - Transparent Proxy Config
# Role: intercept WireGuard client traffic (via iptables TPROXY),
#       route AI sites through residential proxy, everything else direct.
#
# Managed by: server/setup_clash.sh
# Do NOT edit proxy credentials here directly — use setup_clash.sh --update-proxy

# Transparent proxy port (iptables TPROXY with --on-ip 127.0.0.1 --on-port 7893)
tproxy-port: 7893

# HTTP/SOCKS5 proxy port for manual use or testing
mixed-port: 7890

bind-address: 127.0.0.1
allow-lan: false

mode: rule
log-level: info
ipv6: false

# TLS SNI sniffing: lets Clash route HTTPS by domain without decryption
sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080]

# DNS: disabled — we rely on SNI sniffing for domain-based routing.
# Clients use 8.8.8.8 (via WireGuard DNS setting) which is unaffected.
dns:
  enable: false

proxies:
  - name: residential-static
    type: http
    server: geo.iproyal.com
    port: 12321
    username: "REDACTED-PROXY-USERNAME"
    password: "REDACTED-PROXY-PASSWORD"
    tls: false

proxy-groups:
  - name: AI-Sites
    type: select
    proxies:
      - residential-static

rules:
  # Anthropic / Claude
  - DOMAIN-SUFFIX,claude.ai,AI-Sites
  - DOMAIN-SUFFIX,claude.com,AI-Sites
  - DOMAIN-SUFFIX,anthropic.com,AI-Sites
  - DOMAIN-SUFFIX,claudeusercontent.com,AI-Sites

  # OpenAI / ChatGPT
  - DOMAIN-SUFFIX,openai.com,AI-Sites
  - DOMAIN-SUFFIX,chatgpt.com,AI-Sites
  - DOMAIN-SUFFIX,oaistatic.com,AI-Sites
  - DOMAIN-SUFFIX,oaiusercontent.com,AI-Sites

  # Google AI
  - DOMAIN-SUFFIX,gemini.google.com,AI-Sites
  - DOMAIN-SUFFIX,bard.google.com,AI-Sites

  # All other traffic: go direct through ECS public IP
  - MATCH,DIRECT
